# Warewulf configuration recorded from the cluster build log.
# Reference configuration; adapt IPs/interfaces to your own environment.

WW_INTERNAL: 43
ipaddr: 192.168.10.2
netmask: 255.255.255.0
network: 192.168.10.0
device: enp3s0
warewulf:
    port: 9873
    tls port: 9874
    secure: false
    update interval: 60
    autobuild overlays: true
    host overlay: true
    grubboot: false
    systemd name: warewulfd
api:
    enabled: false
    allowed subnets:
        - 127.0.0.0/8
        - ::1/128
dhcp:
    enabled: true
    template: default
    range start: 192.168.10.10
    range end: 192.168.10.255
    systemd name: dhcpd
tftp:
    enabled: true
    tftproot: /srv/tftpboot
    systemd name: tftp
    ipxe:
        00:0B: arm64-efi/snponly.efi
        "00:00": undionly.kpxe
        "00:07": ipxe-snponly-x86_64.efi
        "00:09": ipxe-snponly-x86_64.efi
nfs:
    enabled: true
    export paths:
        - path: /home
          export options: rw,sync
        - path: /opt
          export options: ro,sync,no_root_squash
    systemd name: nfs-server
ssh:
    key types:
        - ed25519
        - ecdsa
        - rsa
        - dsa
paths:
    bindir: /usr/bin
    sysconfdir: /etc
    localstatedir: /srv
    cachedir: /var/cache
    ipxesource: /usr/share/ipxe
    srvdir: /srv
    firewallddir: /usr/lib/firewalld/services
    systemddir: /usr/lib/systemd/system
    datadir: /usr/share
    wwoverlaydir: /srv/warewulf/overlays
    wwchrootdir: /srv/warewulf/chroots
    wwprovisiondir: /srv/warewulf/provision
    wwclientdir: /warewulf
    wwfilesdir: /srv/warewulf/files
