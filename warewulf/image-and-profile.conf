# Rocky Linux 9 image/profile commands recorded in the build.

sudo wwctl container import docker://rockylinux:9 rockylinux-9
sudo wwctl profile set default --container rockylinux-9 --netdev enp3s0
# Note: the log reports --container as deprecated; --image is the newer form.
sudo wwctl profile set default --image rockylinux-9 -y
sudo wwctl node set node[01-04] --image rockylinux-9 -y
sudo wwctl overlay build
