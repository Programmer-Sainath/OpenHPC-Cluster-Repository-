# Munge setup recorded from the build.
# The actual munge.key is intentionally NOT included in this repository.

sudo create-munge-key -f
sudo mkdir -p /srv/warewulf/overlays/runtime/etc/munge/
sudo cp /etc/munge/munge.key /srv/warewulf/overlays/runtime/etc/munge/munge.key
sudo chown munge:munge /srv/warewulf/overlays/runtime/etc/munge/munge.key
sudo chmod 0400 /srv/warewulf/overlays/runtime/etc/munge/munge.key
sudo systemctl enable --now munge
