# firewalld rules recorded from the working cluster setup.

sudo firewall-cmd --permanent --add-service=dhcp
sudo firewall-cmd --permanent --add-service=tftp
sudo firewall-cmd --permanent --add-service=nfs
sudo firewall-cmd --permanent --add-port=9873/tcp      # Warewulfd
sudo firewall-cmd --permanent --add-port=6817-6818/tcp  # Slurmctld / Slurmd
sudo firewall-cmd --reload
