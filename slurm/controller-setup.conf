# Slurm controller setup commands recorded in the build.

sudo dnf install -y epel-release
sudo dnf install -y slurm-slurmctld slurm-slurmd munge

sudo groupadd -r -g 992 slurm 2>/dev/null || sudo groupadd -r slurm
sudo useradd -r -g slurm -u 992 -d /var/lib/slurm -s /bin/false slurm 2>/dev/null || sudo useradd -r -g slurm -d /var/lib/slurm -s /bin/false slurm

sudo mkdir -p /var/spool/slurmctld
sudo chown -R slurm:slurm /var/spool/slurmctld
sudo chmod 755 /var/spool/slurmctld

sudo systemctl enable --now munge
sudo systemctl enable --now slurmctld
